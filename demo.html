  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {

  </style>

  <script>
  (function() {

    // UTM источник
    var source = window.TRAFFIC_SOURCE || 'direct';

    // Идентификатор сессии — чтобы связывать pageview/play/lead одного посетителя
    function getSessionId() {
      var sid = sessionStorage.getItem('donna_session_id');
      if (!sid) {
        sid = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : 'sid-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        sessionStorage.setItem('donna_session_id', sid);
      }
      return sid;
    }
    var sessionId = getSessionId();

    // Трекер событий в Supabase
    function trackDemo(eventName) {
      fetch('/.netlify/functions/track-demo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event: eventName, source: source, session_id: sessionId })
      }).catch(function() {});
    }

    // Pageview
    trackDemo('pageview');
    var isReferral = source === 'referral';

    // Показываем реферальную плашку
    if (isReferral) {
      document.getElementById('referral-badge').classList.add('visible');
    }

    // ── СФЕРА ────────────────────────────────────────────────────────────
    var sc = document.getElementById('sphere-canvas');
    var sCtx = sc.getContext('2d');
    var SW = 192, SH = 192;
    var sAngle = 0;

    var rings = [
      { color: 'rgba(212,175,55,0.7)', width: 1.5 },
      { color: 'rgba(212,175,55,0.35)', width: 1 },
      { color: 'rgba(180,160,220,0.5)', width: 1.2 },
      { color: 'rgba(212,175,55,0.2)', width: 0.8 },
    ];

    function drawSphere() {
      sCtx.clearRect(0, 0, SW, SH);
      sCtx.save();
      sCtx.beginPath();
      sCtx.arc(SW/2, SH/2, SW/2-1, 0, Math.PI*2);
      sCtx.clip();
      sCtx.fillStyle = '#0d1030';
      sCtx.fillRect(0, 0, SW, SH);

      var grd = sCtx.createRadialGradient(SW*0.35, SH*0.3, 0, SW/2, SH/2, SW/2);
      grd.addColorStop(0, 'rgba(212,175,55,0.18)');
      grd.addColorStop(0.5, 'transparent');
      grd.addColorStop(1, 'rgba(75,0,130,0.25)');
      sCtx.fillStyle = grd;
      sCtx.fillRect(0, 0, SW, SH);

      var cx = SW/2, cy = SH/2, r = SW/2-2;
      for (var i = 0; i < 7; i++) {
        var latAngle = -Math.PI/2 + Math.PI*(i/7);
        var ringR = Math.cos(latAngle)*r;
        var ringY = cy + Math.sin(latAngle)*r;
        var rotOffset = sAngle*(i%2===0?1:-0.7)+i*0.4;
        var ri = rings[i % rings.length];
        sCtx.save();
        sCtx.translate(cx, ringY);
        sCtx.scale(1, 0.22);
        sCtx.beginPath();
        sCtx.arc(0, 0, Math.abs(ringR), 0, Math.PI*2);
        sCtx.strokeStyle = ri.color;
        sCtx.lineWidth = ri.width*(1+0.3*Math.cos(latAngle));
        sCtx.stroke();
        var dotCount = Math.floor(Math.abs(ringR)/12);
        for (var d = 0; d < dotCount; d++) {
          var dAngle = (d/dotCount)*Math.PI*2+rotOffset;
          sCtx.beginPath();
          sCtx.arc(Math.cos(dAngle)*Math.abs(ringR), Math.sin(dAngle)*Math.abs(ringR), 1.2, 0, Math.PI*2);
          sCtx.fillStyle = 'rgba(248,245,235,0.85)';
          sCtx.fill();
        }
        sCtx.restore();
      }

      var shine = sCtx.createRadialGradient(cx-r*0.3, cy-r*0.3, 0, cx, cy, r);
      shine.addColorStop(0, 'rgba(255,255,255,0.07)');
      shine.addColorStop(0.4, 'transparent');
      sCtx.fillStyle = shine;
      sCtx.fillRect(0, 0, SW, SH);
      sCtx.restore();
    }

    // ── ФОНОВЫЙ CANVAS ────────────────────────────────────────────────────
    var bgCanvas = document.getElementById('bg-canvas');
    var bCtx = bgCanvas.getContext('2d');
    var BW, BH, gradPhase = 0;
    var mouseX = -1000, mouseY = -1000;

    function resizeBg() {
      BW = bgCanvas.width = window.innerWidth;
      BH = bgCanvas.height = window.innerHeight;
    }

    document.addEventListener('mousemove', function(e) { mouseX = e.clientX; mouseY = e.clientY; });
    document.addEventListener('mouseleave', function() { mouseX = -1000; mouseY = -1000; });

    var mood = window.moodConfig || {};
    var PARTICLE_COUNT = Math.round(60 * (mood.particleDensity || 1.0));
    var particles = [];

    function initParticles() {
      particles = [];
      for (var i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random()*BW, y: Math.random()*BH,
          r: Math.random()*2+0.6,
          opacity: Math.random()*0.6+0.2,
          speedX: (Math.random()-0.5)*0.2,
          speedY: (Math.random()-0.5)*0.2,
          opacitySpeed: (Math.random()-0.5)*0.004,
        });
      }
    }

    function drawBg() {
      bCtx.clearRect(0, 0, BW, BH);
      gradPhase += 0.003;
      var cx1 = BW*0.5 + Math.sin(gradPhase*0.7)*BW*0.15;
      var cy1 = BH*0.15 + Math.cos(gradPhase*0.5)*BH*0.08;
      var grd = bCtx.createRadialGradient(cx1, cy1, 0, BW/2, BH/2, BH*0.9);
      grd.addColorStop(0, 'rgba(40,45,92,0.95)');
      grd.addColorStop(0.4, 'rgba(21,25,51,0.85)');
      grd.addColorStop(1, 'rgba(10,12,30,0.9)');
      bCtx.fillStyle = grd;
      bCtx.fillRect(0, 0, BW, BH);

      if (mouseX > 0) {
        var mgrd = bCtx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 160);
        mgrd.addColorStop(0, 'rgba(212,175,55,0.08)');
        mgrd.addColorStop(1, 'transparent');
        bCtx.fillStyle = mgrd;
        bCtx.fillRect(0, 0, BW, BH);
      }

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.speedX; p.y += p.speedY; p.opacity += p.opacitySpeed;
        if (mouseX > 0) {
          var dx = mouseX-p.x, dy = mouseY-p.y;
          var dist = Math.sqrt(dx*dx+dy*dy);
          if (dist < 180) { p.x += dx/dist*0.15; p.y += dy/dist*0.15; }
        }
        if (p.opacity < 0.15) p.opacitySpeed = Math.abs(p.opacitySpeed);
        if (p.opacity > 0.85) p.opacitySpeed = -Math.abs(p.opacitySpeed);
        if (p.x < 0) p.x = BW; if (p.x > BW) p.x = 0;
        if (p.y < 0) p.y = BH; if (p.y > BH) p.y = 0;
        bCtx.beginPath();
        bCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        bCtx.fillStyle = 'rgba(212,175,55,'+p.opacity+')';
        bCtx.fill();
      }
    }

    // ── ПЛЕЕР С ПРИВЕТСТВИЕМ ─────────────────────────────────────────────
    var welcomeAudio = document.getElementById('audio-welcome');
    var audio = document.getElementById('audio-demo');
    var isPlaying = false;
    var unlocked = false;
    var welcomePlaying = false;
    var BARS = 56;
    var wf = document.getElementById('waveform');
    var welcomeBtn = document.getElementById('welcome-btn');
    var welcomeLabel = document.getElementById('welcome-label');

    for (var i = 0; i < BARS; i++) {
      var h = 8 + Math.random()*28;
      var bar = document.createElement('div');
      bar.className = 'wave-bar';
      bar.style.height = h + 'px';
      wf.appendChild(bar);
    }

    // Pause Detection — мягкий CTA после значимой паузы (только на основном треке)
    if (typeof window.setupPauseDetection === 'function') {
      window.setupPauseDetection(audio);
    }

    // Приветствие — отдельная, необязательная дорожка. Не блокирует и не запускает основной трек.
    welcomeAudio.addEventListener('ended', function() {
      setWelcomePlaying(false);
    });

    window.toggleWelcome = function() {
      if (welcomePlaying) {
        welcomeAudio.pause();
        setWelcomePlaying(false);
        return;
      }
      // Не даём звучать двум дорожкам одновременно
      if (isPlaying) {
        audio.pause();
        setPlaying(false);
      }
      welcomeAudio.play().catch(function() {});
      setWelcomePlaying(true);
      trackDemo('welcome_play');
    };

    function setWelcomePlaying(v) {
      welcomePlaying = v;
      welcomeBtn.classList.toggle('playing', v);
      welcomeLabel.textContent = v ? 'Приветствие от Екатерины' : 'Послушать приветствие от Екатерины';
    }

    window.togglePlay = function() {
      if (isPlaying) {
        audio.pause();
        setPlaying(false);
      } else {
        // Не даём звучать двум дорожкам одновременно
        if (welcomePlaying) {
          welcomeAudio.pause();
          setWelcomePlaying(false);
        }
        audio.play().catch(function() {});
        setPlaying(true);

        // FB Pixel ViewContent + Supabase при первом нажатии play
        if (!window._fbViewFired) {
          window._fbViewFired = true;
          trackDemo('play');
          if (typeof fbq !== 'undefined') fbq('track', 'ViewContent', {
            content_name: 'demo_track',
            traffic_source: source
          });
        }
      }
    };

    function setPlaying(v) {
      isPlaying = v;
      document.getElementById('icon-play').style.display = v ? 'none' : 'block';
      document.getElementById('icon-pause').style.display = v ? 'block' : 'none';
    }

    window.skipBack = function() {
      audio.currentTime = Math.max(0, audio.currentTime - 15);
    };

    window.skipForward = function() {
      audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15);
    };

    window.seekAudio = function(e) {
      var track = document.getElementById('progress-track');
      var rect = track.getBoundingClientRect();
      var pct = (e.clientX - rect.left) / rect.width;
      if (audio.duration) audio.currentTime = pct * audio.duration;
    };

    function formatTime(s) {
      if (isNaN(s)) return '0:00';
      var m = Math.floor(s / 60), sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    // Прогресс-бар реагирует только на основной трек
    audio.addEventListener('timeupdate', function() {
      var pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-thumb').style.left = pct + '%';
      document.getElementById('time-cur').textContent = formatTime(audio.currentTime);

      var bars = wf.querySelectorAll('.wave-bar');
      var idx = Math.floor((audio.currentTime / (audio.duration || 1)) * BARS);
      bars.forEach(function(b, i) {
        b.classList.remove('played', 'active');
        if (i < idx) b.classList.add('played');
        if (i === idx) b.classList.add('active');
      });

      // FB Pixel Lead + Supabase на 3 минутах основного трека
      if (!window._fbLeadFired && audio.currentTime >= 180) {
        window._fbLeadFired = true;
        trackDemo('lead');
        if (typeof fbq !== 'undefined') fbq('track', 'Lead', {
          traffic_source: source
        });
      }

      // Разблокировка кнопки на 90%
      if (!unlocked && audio.duration && audio.currentTime / audio.duration > 0.9) unlock();
    });

    audio.addEventListener('loadedmetadata', function() {
      document.getElementById('time-total').textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', function() { setPlaying(false); unlock(); });

    function unlock() {
      if (unlocked) return;
      unlocked = true;
      var btn = document.getElementById('purchase-btn');
      btn.classList.remove('locked');
      btn.classList.add('unlocked');
      document.getElementById('lock-icon').style.display = 'none';
      document.getElementById('purchase-label').textContent = 'Перейти к ступени 1 · 150€';
      document.getElementById('purchase-note').classList.add('visible');
    }

    window.goToPurchase = function() {
      if (!unlocked) return;
      window.location.href = 'https://ekaterina-donnat.com/?from=demo&utm_source=' + source + '#buy';
    };

    // ── LOOP ─────────────────────────────────────────────────────────────
    function loop() {
      var mood = window.moodConfig || {};
      sAngle += (mood.pulseSpeed || 0.004);
      drawSphere();
      drawBg();
      requestAnimationFrame(loop);
    }

    resizeBg();
    initParticles();
    window.addEventListener('resize', function() { resizeBg(); initParticles(); });
    loop();

  })();
  </script>

</body>
