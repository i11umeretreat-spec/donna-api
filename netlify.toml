[build]
  command    = "node scripts/ci-checks.js && npm audit --audit-level=critical"
  functions  = "netlify/functions"
  publish    = "."

[functions]
  node_bundler = "esbuild"

# Порядок важен: сначала ci-checks.js (синтаксис функций + инлайн-скриптов,
# ES5-чистота клиентского кода), потом npm audit. Если что-то из этого
# упадёт — деплой не публикуется.
#
# Если audit найдёт критические уязвимости — деплой падает.
# Уровень "critical" (не "high") чтобы не ломать билд на уже известные
# умеренные issues в AWS SDK или Supabase client.
# Когда npm audit будет чистым — можно поднять до --audit-level=high.
