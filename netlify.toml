[build]
  command    = "node scripts/ci-checks.js && npm audit --audit-level=critical"
  functions  = "netlify/functions"
  publish    = "."

[functions]
  node_bundler = "esbuild"

# Порядок важен: сначала ci-checks.js (синтаксис функций + инлайн-скриптов,
# ES5-чистота клиентского кода), потом npm audit. Если что-то из этого
# упадёт — деплой не публикуется.
#
# Если audit найдёт критические уязвимости — деплой падает.
# Уровень "critical" (не "high") чтобы не ломать билд на уже известные
# умеренные issues в AWS SDK или Supabase client.
# Когда npm audit будет чистым — можно поднять до --audit-level=high.

# Каталог продуктов. Netlify и так отдаёт /vybor для vybor.html,
# но правило зафиксировано явно, чтобы поведение не зависело
# от настроек Pretty URLs.
[[redirects]]
  from   = "/vybor"
  to     = "/vybor.html"
  status = 200

# Короткий адрес для рассылки Кати в вотсапе. Метка живёт здесь,
# а не в тексте сообщений: так её нельзя потерять при копировании
# и не надо переписывать в каждом чате.
#
# status = 302, а не 200: при рерайте адрес в браузере остался бы /wa
# без параметров, podbor.html читает метку из window.location.search
# и атрибуция потерялась бы целиком.
#
# utm_source намеренно не ставим: VALID_SOURCES это закрытый список
# paid/referral/pinterest/organic, и «whatsapp» в него не входит.
# Личное сообщение это не органика и не реферальная программа —
# врать в поле source ради красоты не стоит, метка from несёт всё.
[[redirects]]
  from   = "/wa"
  to     = "/podbor.html?from=wa_warm"
  status = 302
  force  = true

# Логотип не меняется, кэшируем надолго
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
