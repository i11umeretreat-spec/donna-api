[build]
  command    = "node scripts/ci-checks.js && npm audit --audit-level=critical"
  functions  = "netlify/functions"
  publish    = "."

[functions]
  node_bundler = "esbuild"

# Порядок важен: сначала ci-checks.js (синтаксис функций + инлайн-скриптов,
# ES5-чистота клиентского кода), потом npm audit. Если что-то из этого
# упадёт — деплой не публикуется.
#
# Если audit найдёт критические уязвимости — деплой падает.
# Уровень "critical" (не "high") чтобы не ломать билд на уже известные
# умеренные issues в AWS SDK или Supabase client.
# Когда npm audit будет чистым — можно поднять до --audit-level=high.

# Каталог продуктов. Netlify и так отдаёт /vybor для vybor.html,
# но правило зафиксировано явно, чтобы поведение не зависело
# от настроек Pretty URLs.
[[redirects]]
  from   = "/vybor"
  to     = "/vybor.html"
  status = 200

# Короткий адрес для рассылки Кати в вотсапе. Метка живёт здесь,
# а не в тексте сообщений: так её нельзя потерять при копировании
# и не надо переписывать в каждом чате.
#
# status = 302, а не 200: при рерайте адрес в браузере остался бы /wa
# без параметров, podbor.html читает метку из window.location.search
# и атрибуция потерялась бы целиком.
#
# utm_source намеренно не ставим: VALID_SOURCES это закрытый список
# paid/referral/pinterest/organic, и «whatsapp» в него не входит.
# Личное сообщение это не органика и не реферальная программа —
# врать в поле source ради красоты не стоит, метка from несёт всё.
[[redirects]]
  from   = "/wa"
  to     = "/podbor.html?from=wa_warm"
  status = 302
  force  = true

# Вторая ссылка для вотсапа, на флагманскую практику. Катя ведёт людей
# по двум путям: кто не знает, с чего начать, идёт на подбор, кто уже
# понял, что хочет, идёт сразу к «Памяти тела».
#
# Ведёт на корневой домен, а не к нам: блок флагмана живёт в Тильде,
# своей страницы под него у нас нет.
#
# Параметр стоит ДО решётки. После неё он попал бы во фрагмент, а скрипт
# блока читает window.location.search, и метка не дошла бы. Тем же
# параметром живёт client_reference_id у кнопки оплаты, так что метка
# доезжает до самой покупки в Stripe, а не теряется на витрине.
[[redirects]]
  from   = "/pamyat"
  to     = "https://ekaterina-donnat.com/?from=wa_flagman#pamyat-tela"
  status = 302
  force  = true

# Четыре коротких адреса для инстаграма.
#
# За четырнадцать дней тринадцать сессий пришли с utm_source=instagram
# и без метки, всплесками: 19.08 две, 21.08 семь, 24.08 одна, 26.08 девять,
# 27.08 четыре. Постоянная ссылка в шапке так себя не ведёт, там ровный
# ручеёк, и он размечен: ig_bio даёт 1, 1, 3, 1, 5 день за днём. Всплески
# это сторис и посты, где адрес вставляют заново каждый раз и параметр
# теряется. Копируемая короткая ссылка это единственное, что удерживает
# метку: у вотсапа так и вышло, восемь переходов 31.08 дали восемь
# начатых подборов и семь пройденных.
#
# Пути живут здесь, а не на корневом домене: редиректы обслуживает Netlify,
# а ekaterina-donnat.com это Тильда, произвольных путей она не знает.
# Всё, что уходит наружу, начинается с app.
#
# utm_source=instagram проставлен намеренно: главная и подбор раскладывают
# его в paid, и источник совпадает с тем, что уже пишется для ig_bio.
# У /wa и /pamyat этого параметра нет, вотсап пишется как organic, и это
# верно, вотсап не инстаграм.
#
# Параметры стоят до решётки: после неё они попали бы во фрагмент, а скрипты
# блоков читают window.location.search. Тот же порядок, что у /pamyat.

# Флагман, «Память тела».
[[redirects]]
  from   = "/fl"
  to     = "https://ekaterina-donnat.com/?from=ig_fl&utm_source=instagram#pamyat-tela"
  status = 302
  force  = true

# Премиум-блок: полный альбом, комбо, чек-ап.
[[redirects]]
  from   = "/pr"
  to     = "https://ekaterina-donnat.com/?from=ig_pr&utm_source=instagram#premium"
  status = 302
  force  = true

# Программа целиком, четыре ступени.
[[redirects]]
  from   = "/acc"
  to     = "https://ekaterina-donnat.com/?from=ig_acc&utm_source=instagram#program"
  status = 302
  force  = true

# Подбор практики. Единственный из четырёх остаётся внутри домена,
# поэтому адрес относительный, как у /wa.
[[redirects]]
  from   = "/test"
  to     = "/podbor.html?from=ig_test&utm_source=instagram"
  status = 302
  force  = true

# Логотип не меняется, кэшируем надолго
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
