<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Donna Audio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Noto+Serif+Display:ital,wght@0,200;0,300;1,200;1,300&display=swap');
        
        body {
            background-color: #151933;
            background: radial-gradient(circle at 50% 0%, #282d5c 0%, #151933 100%);
            background-attachment: fixed;
            color: rgba(248, 250, 252, 0.95);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color-scheme: dark;
        }
        
        .app-header {
            padding: 50px 20px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .app-title {
            font-family: 'Noto Serif Display', serif;
            font-weight: 300;
            color: #d4af37;
            font-size: 34px;
            margin-bottom: 12px;
            letter-spacing: 0.02em;
        }
        
        .app-subtitle {
            font-weight: 200;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(248, 250, 252, 0.5);
            margin-bottom: 24px;
        }

        .badge {
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 100px;
            padding: 6px 16px;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.05);
        }
        
        .tracks-container {
            padding: 0 20px 40px;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .player-card {
            background: rgba(23, 27, 54, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .player-card.active {
            border-color: rgba(212, 175, 55, 0.4);
            background: rgba(23, 27, 54, 0.6);
            box-shadow: 0 10px 30px -10px rgba(212, 175, 55, 0.15);
        }
        
        .card-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .play-btn {
            width: 54px;
            height: 54px;
            min-width: 54px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .play-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: scale(1.05);
        }

        .player-card.active .play-btn {
            background: #d4af37;
            color: #151933;
        }
        
        .play-icon, .pause-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        
        .play-icon { margin-left: 4px; }
        .pause-icon { display: none; }
        .player-card.active .play-icon { display: none; }
        .player-card.active .pause-icon { display: block; }
        
        .track-info { flex: 1; }
        
        .track-title {
            font-family: 'Noto Serif Display', serif;
            font-weight: 300;
            font-size: 20px;
            color: rgba(248, 250, 252, 0.95);
            margin-bottom: 4px;
            line-height: 1.2;
            transition: color 0.3s ease;
        }

        .player-card.active .track-title { color: #d4af37; }
        
        .track-meta {
            font-weight: 200;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(248, 250, 252, 0.5);
        }

        .download-btn {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #d4af37;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: auto;
        }

        .download-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
            transform: scale(1.05);
        }

        .download-btn.loading {
            opacity: 0.4;
            cursor: wait;
            transform: none;
        }

        .download-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .download-btn .spin {
            width: 14px; height: 14px;
            border: 1.5px solid rgba(212, 175, 55, 0.3);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .progress-area {
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.4;
            transition: opacity 0.3s ease;
        }

        .player-card.active .progress-area { opacity: 1; }
        
        .time {
            font-size: 10px;
            font-weight: 300;
            color: rgba(248, 250, 252, 0.7);
            width: 35px;
            text-align: center;
        }
        
        .progress-bar-wrap {
            flex: 1;
            height: 24px;
            display: flex;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            position: relative;
            pointer-events: none;
        }
        
        .progress-fill {
            position: absolute;
            left: 0; top: 0;
            height: 100%;
            background: #d4af37;
            width: 0%;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -4px; top: -3px;
            width: 10px; height: 10px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .player-card.active .progress-fill::after { opacity: 1; }

        .system-message {
            text-align: center;
            padding: 40px 20px;
            color: rgba(248, 250, 252, 0.7);
            font-weight: 300;
            line-height: 1.6;
        }

        .loader {
            width: 30px; height: 30px;
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Апсейл - только для гостей */
        .upsell-card {
            background: rgba(23, 27, 54, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            margin-top: 8px;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .upsell-label {
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(212, 175, 55, 0.5);
            margin-bottom: 12px;
        }

        .upsell-title {
            font-family: 'Noto Serif Display', serif;
            font-weight: 300;
            font-size: 22px;
            color: #f0eae1;
            margin-bottom: 12px;
        }

        .upsell-text {
            font-weight: 300;
            font-size: 13px;
            color: rgba(248, 250, 252, 0.6);
            margin-bottom: 28px;
            line-height: 1.7;
        }

        .btn-primary {
            display: block;
            background: #d4af37;
            color: #151933;
            padding: 16px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 500;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #e5c158;
            transform: scale(1.02);
        }

        .btn-secondary {
            display: block;
            background: transparent;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 16px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1 class="app-title">Екатерина Донна</h1>
        <div class="app-subtitle">Глубинная работа с подсознанием</div>
        <div class="badge">Sound by Audio Laguna</div>
    </header>

    <div id="app-content" class="tracks-container">
        <div class="system-message">
            <div class="loader"></div>
            Подготавливаем пространство...
        </div>
    </div>

    <audio id="mainAudio" playsinline preload="none"></audio>

    <script>
        const audio = document.getElementById('mainAudio');
        let currentCard = null;
        let isPlaying = false;
        let currentToken = null;

        // Гостевой демо-трек
        const DEMO_TRACK = {
            id: 'water_energy',
            title: 'Баланс стихий',
            type: 'Сеанс самогипноза · Энергетическое наполнение',
            streamUrl: 'https://pub-a1dfcf27afc040398c3bc3e4bf3f6416.r2.dev/promo/water_energy.mp3',
            duration: '21:00'
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const container = document.getElementById('app-content');

            if (!token) {
                // Гость без токена - показываем демо + апсейл
                renderTracks([DEMO_TRACK], false, true);
                return;
            }

            currentToken = token;

            try {
                const response = await fetch('/.netlify/functions/verify-token?token=' + token);
                const data = await response.json();

                if (!response.ok || !data.valid) {
                    container.innerHTML = '<div class="system-message">Срок действия ключа истёк или он неверен.<br>Пожалуйста, проверьте ваше письмо.</div>';
                    return;
                }

                if (!data.tracks || data.tracks.length === 0) {
                    // Гостевой токен из формы - только демо + апсейл
                    renderTracks([DEMO_TRACK], false, true);
                    return;
                }

                // Платный клиент - треки без апсейла
                renderTracks(data.tracks, true, false);

            } catch (error) {
                container.innerHTML = '<div class="system-message">Ошибка соединения с сервером.<br>Пожалуйста, обновите страницу.</div>';
            }
        });

        function renderTracks(tracks, allowDownload, showUpsell) {
            const container = document.getElementById('app-content');
            let html = '';
            
            tracks.forEach(track => {
                html += `
                <div class="player-card" data-url="${track.streamUrl}" data-track-id="${track.id}">
                    <div class="card-top">
                        <button class="play-btn" onclick="togglePlay(this.closest('.player-card'))">
                            <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            <svg class="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>
                        <div class="track-info">
                            <div class="track-title">${track.title}</div>
                            <div class="track-meta">${track.type}${track.duration ? ' · ' + track.duration : ''}</div>
                        </div>
                        ${allowDownload ? `
                        <button class="download-btn" onclick="downloadTrack(this, '${track.id}')" title="Скачать практику">
                            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        </button>` : ''}
                    </div>
                    <div class="progress-area">
                        <span class="time current-time">0:00</span>
                        <div class="progress-bar-wrap"
                             onmousedown="startSeek(event, this)"
                             ontouchstart="startSeek(event, this)">
                            <div class="progress-track">
                                <div class="progress-fill"></div>
                            </div>
                        </div>
                        <span class="time total-time">${track.duration || '0:00'}</span>
                    </div>
                </div>`;
            });

            // Апсейл только для гостей
            if (showUpsell) {
                html += `
                <div class="upsell-card">
                    <div class="upsell-label">Следующий шаг</div>
                    <div class="upsell-title">Глубокое погружение</div>
                    <div class="upsell-text">
                        Открой для себя полную коллекцию нейропрактик или запишись
                        на личный чек-ап к Екатерине для точечной работы с подсознанием.
                    </div>
                    <a href="https://ekaterina-donnat.com" class="btn-primary" target="_blank">
                        Полная коллекция
                    </a>
                    <a href="https://ekaterina-donnat.com/#checkup" class="btn-secondary" target="_blank">
                        Записаться на чек-ап
                    </a>
                </div>`;
            }

            container.innerHTML = html;
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function togglePlay(card) {
            const url = card.getAttribute('data-url');
            
            if (currentCard !== card) {
                if (currentCard) {
                    currentCard.classList.remove('active');
                    currentCard.querySelector('.progress-fill').style.width = '0%';
                    currentCard.querySelector('.current-time').textContent = '0:00';
                }
                currentCard = card;
                currentCard.classList.add('active');
                
                audio.src = url;
                audio.load();
                audio.play().then(() => {
                    isPlaying = true;
                }).catch(e => console.error('Play error:', e));

            } else {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    currentCard.classList.remove('active');
                } else {
                    audio.play().then(() => {
                        isPlaying = true;
                        currentCard.classList.add('active');
                    }).catch(e => console.error('Play error:', e));
                }
            }
        }

        audio.addEventListener('loadedmetadata', () => {
            if (currentCard && audio.duration && audio.duration !== Infinity) {
                currentCard.querySelector('.total-time').textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && audio.duration !== Infinity && currentCard) {
                const percent = (audio.currentTime / audio.duration) * 100;
                currentCard.querySelector('.progress-fill').style.width = percent + '%';
                currentCard.querySelector('.current-time').textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            if (currentCard) {
                currentCard.classList.remove('active');
                currentCard.querySelector('.progress-fill').style.width = '0%';
                currentCard.querySelector('.current-time').textContent = '0:00';
            }
        });

        // Seek - мышь и touch для iOS
        let isSeeking = false;

        function seek(e, wrap) {
            const card = wrap.closest('.player-card');
            if (card !== currentCard || !audio.duration || audio.duration === Infinity) return;
            const rect = wrap.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            audio.currentTime = pos * audio.duration;
        }

        function startSeek(e, wrap) {
            e.preventDefault();
            isSeeking = true;
            seek(e, wrap);

            const onMove = (ev) => { if (isSeeking) seek(ev, wrap); };
            const onEnd = () => {
                isSeeking = false;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            };

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        }

        // Скачивание - через <a download> для корректной работы на iOS
        async function downloadTrack(btn, trackId) {
            if (btn.classList.contains('loading')) return;
            btn.classList.add('loading');
            btn.innerHTML = '<div class="spin"></div>';

            try {
                const res = await fetch('/.netlify/functions/get-download-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: currentToken, trackId }),
                });

                const data = await res.json();
                if (!res.ok || !data.url) throw new Error('No URL');

                // <a download> вместо window.location.href - корректно на iOS
                const a = document.createElement('a');
                a.href = data.url;
                a.download = '';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

            } catch (err) {
                console.error('Download error:', err);
                alert('Не удалось подготовить файл. Попробуйте ещё раз.');
            } finally {
                btn.classList.remove('loading');
                btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>';
            }
        }
    </script>
</body>
</html>
